name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (warnings as errors)
        shell: pwsh
        run: |
          .\scripts\cmake-configure.ps1 -BuildDir build -Clean `
            -DefineArg "-DWINTUNE_WARNINGS_AS_ERRORS=ON"

      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = ".\build\Release\wintune.exe"
          & $exe version
          & $exe help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
