name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      package_dry_run:
        description: "Run x64 package dry-run (ZIP)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    # Stable name — set this as a required status check on main/master.
    name: Lint and build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake build (x64)
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: wintune-x64-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'resources/**', 'tests/**', 'scripts/cmake-configure.ps1') }}
          restore-keys: |
            wintune-x64-${{ runner.os }}-

      - name: Configure (warnings as errors)
        shell: pwsh
        run: |
          $clean = ($env:CACHE_HIT -ne "true")
          if ($clean) {
            .\scripts\cmake-configure.ps1 -BuildDir build -Arch x64 -Clean `
              -DefineArg "-DWINTUNE_WARNINGS_AS_ERRORS=ON"
          } else {
            Write-Host "Cache hit — incremental configure (no -Clean)"
            .\scripts\cmake-configure.ps1 -BuildDir build -Arch x64 `
              -DefineArg "-DWINTUNE_WARNINGS_AS_ERRORS=ON"
          }
        env:
          CACHE_HIT: ${{ steps.cache-build.outputs.cache-hit }}

      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Unit tests
        shell: pwsh
        run: .\scripts\test.ps1 -Config Release -BuildDir build

      - name: CLI smoke tests
        shell: pwsh
        run: |
          .\scripts\smoke.ps1 -Config Release -SkipSlow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-arm64:
    name: Build (Windows ARM64)
    # Native ARM64 + VS 2026. Cross-compiling ARM64 on windows-latest (x64) lacks
    # the MSVC ARM64 toolchain unless the workload is installed separately.
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake 4.3+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.3.3"

      - name: Cache CMake build (ARM64)
        id: cache-build-arm
        uses: actions/cache@v4
        with:
          path: build-arm64
          key: wintune-arm64-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'resources/**', 'tests/**', 'scripts/cmake-configure.ps1') }}
          restore-keys: |
            wintune-arm64-${{ runner.os }}-

      - name: Environment diagnostics
        shell: pwsh
        run: |
          cmake --version
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $vw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vw)) {
            $vw = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (Test-Path $vw) {
            & $vw -latest -products * -property installationPath,installationVersion
          } else {
            Write-Warning "vswhere not found"
          }

      - name: Configure ARM64
        shell: pwsh
        run: |
          $clean = ($env:CACHE_HIT -ne "true")
          if ($clean) {
            .\scripts\cmake-configure.ps1 -BuildDir build-arm64 -Arch arm64 -Clean `
              -DefineArg "-DWINTUNE_WARNINGS_AS_ERRORS=ON"
          } else {
            Write-Host "Cache hit — incremental configure (no -Clean)"
            .\scripts\cmake-configure.ps1 -BuildDir build-arm64 -Arch arm64 `
              -DefineArg "-DWINTUNE_WARNINGS_AS_ERRORS=ON"
          }
        env:
          CACHE_HIT: ${{ steps.cache-build-arm.outputs.cache-hit }}

      - name: Build Release
        shell: pwsh
        run: .\scripts\cmake-build.ps1 -BuildDir build-arm64 -Config Release -Target wintune

      - name: Unit tests
        shell: pwsh
        run: .\scripts\test.ps1 -Config Release -BuildDir build-arm64

      - name: Smoke tests
        shell: pwsh
        run: |
          $exe = ".\build-arm64\Release\wintune.exe"
          if (-not (Test-Path $exe)) { $exe = ".\build-arm64\wintune.exe" }
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((& $exe version 2>&1 | Out-String) -notmatch "arm64") {
            Write-Warning "Expected arm64 in version output"
          }
          .\scripts\smoke.ps1 -Config Release -Exe $exe -SkipSlow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package-dry-run:
    name: Package dry-run (x64)
    runs-on: windows-latest
    # Tags, PRs labeled "release", or manual workflow_dispatch with package_dry_run.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_dry_run == true) ||
      (github.event_name == 'pull_request' &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'release'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package x64 ZIP (dry-run)
        shell: pwsh
        run: |
          $ver = "0.0.0-ci"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME.TrimStart("v", "V")
          }
          .\scripts\package.ps1 -Config Release -Arch x64 -Version $ver `
            -Channel stable -Configure -Build -Zip -VerifySignature

      - name: Verify package layout
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter "WinTune-*-win-x64.zip" | Select-Object -First 1
          if ($null -eq $zip) { throw "ZIP not found under dist/" }
          Write-Host "ZIP: $($zip.FullName) ($([math]::Round($zip.Length/1KB)) KB)"
          $sha = "$($zip.FullName).sha256"
          if (-not (Test-Path $sha)) { throw "Missing checksum: $sha" }
          $stage = Get-ChildItem -Path dist -Directory -Filter "WinTune-*-win-x64" | Select-Object -First 1
          if ($null -eq $stage) { throw "Stage directory missing" }
          foreach ($f in @("wintune.exe", "VERSION.txt", "ARCH.txt", "QUICKSTART.txt", "SIGNING.txt")) {
            $p = Join-Path $stage.FullName $f
            if (-not (Test-Path -LiteralPath $p)) {
              throw "Missing $f in package stage ($($stage.FullName))"
            }
          }
          $arch = (Get-Content -LiteralPath (Join-Path $stage.FullName "ARCH.txt") -Raw).Trim()
          if ($arch -ne "x64") { throw "ARCH.txt expected x64, got '$arch'" }
          $signing = (Get-Content -LiteralPath (Join-Path $stage.FullName "SIGNING.txt") -Raw).Trim()
          Write-Host "SIGNING.txt: $signing"
          .\scripts\sign.ps1 -Path (Join-Path $stage.FullName "wintune.exe") -Verify -AllowUnsigned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Package dry-run OK"

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintune-x64-dry-run
          path: |
            dist/WinTune-*-win-x64.zip
            dist/WinTune-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
