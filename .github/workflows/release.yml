name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0 or v0.3.0)"
        required: true
        type: string

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="$REF_NAME"
          fi
          v="${v#v}"
          v="${v#V}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Invalid version: $v" >&2
            exit 1
          fi
          channel="stable"
          case "$v" in *-beta*) channel="beta" ;; esac
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  package-x64:
    name: Package (x64)
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Package x64
        shell: pwsh
        env:
          WINTUNE_SIGN_ENABLED: ${{ vars.WINTUNE_SIGN_ENABLED }}
          WINTUNE_SIGN_PFX_BASE64: ${{ secrets.WINTUNE_SIGN_PFX_BASE64 }}
          WINTUNE_SIGN_PASSWORD: ${{ secrets.WINTUNE_SIGN_PASSWORD }}
          WINTUNE_SIGN_TIMESTAMP: ${{ vars.WINTUNE_SIGN_TIMESTAMP }}
        run: |
          .\scripts\package.ps1 -Config Release -Arch x64 -Version ${{ needs.resolve-version.outputs.value }} `
            -Channel ${{ needs.resolve-version.outputs.channel }} -Configure -Build -Zip -SignIfConfigured

      - name: Verify Authenticode (soft if unsigned)
        shell: pwsh
        run: |
          $exe = "dist\WinTune-${{ needs.resolve-version.outputs.value }}-win-x64\wintune.exe"
          $require = ($env:WINTUNE_SIGN_ENABLED -eq "true" -or $env:WINTUNE_SIGN_ENABLED -eq "1")
          if ($require) {
            .\scripts\sign.ps1 -Path $exe -Verify -RequireSigned
          } else {
            .\scripts\sign.ps1 -Path $exe -Verify -AllowUnsigned
          }
        env:
          WINTUNE_SIGN_ENABLED: ${{ vars.WINTUNE_SIGN_ENABLED }}

      - name: Install Inno Setup (optional installer)
        shell: pwsh
        run: .\scripts\install-innosetup.ps1

      - name: Build x64 Setup.exe (optional)
        shell: pwsh
        env:
          WINTUNE_SIGN_ENABLED: ${{ vars.WINTUNE_SIGN_ENABLED }}
          WINTUNE_SIGN_PFX_BASE64: ${{ secrets.WINTUNE_SIGN_PFX_BASE64 }}
          WINTUNE_SIGN_PASSWORD: ${{ secrets.WINTUNE_SIGN_PASSWORD }}
          WINTUNE_SIGN_TIMESTAMP: ${{ vars.WINTUNE_SIGN_TIMESTAMP }}
        run: |
          .\scripts\installer.ps1 -Version ${{ needs.resolve-version.outputs.value }} `
            -Arch x64 -Channel ${{ needs.resolve-version.outputs.channel }} `
            -SignIfConfigured -SkipIfMissingInno

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wintune-x64
          path: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload x64 installer (optional)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wintune-x64-setup
          path: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64-setup.exe
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64-setup.exe.sha256
          if-no-files-found: ignore

  package-arm64:
    name: Package (ARM64)
    needs: resolve-version
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup CMake 4.3+
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "4.3.3"

      - name: Package ARM64
        shell: pwsh
        env:
          WINTUNE_SIGN_ENABLED: ${{ vars.WINTUNE_SIGN_ENABLED }}
          WINTUNE_SIGN_PFX_BASE64: ${{ secrets.WINTUNE_SIGN_PFX_BASE64 }}
          WINTUNE_SIGN_PASSWORD: ${{ secrets.WINTUNE_SIGN_PASSWORD }}
          WINTUNE_SIGN_TIMESTAMP: ${{ vars.WINTUNE_SIGN_TIMESTAMP }}
        run: |
          .\scripts\package.ps1 -Config Release -Arch arm64 -Version ${{ needs.resolve-version.outputs.value }} `
            -Channel ${{ needs.resolve-version.outputs.channel }} -Configure -Build -Zip -SignIfConfigured

      - name: Verify Authenticode (soft if unsigned)
        shell: pwsh
        run: |
          $exe = "dist\WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64\wintune.exe"
          $require = ($env:WINTUNE_SIGN_ENABLED -eq "true" -or $env:WINTUNE_SIGN_ENABLED -eq "1")
          if ($require) {
            .\scripts\sign.ps1 -Path $exe -Verify -RequireSigned
          } else {
            .\scripts\sign.ps1 -Path $exe -Verify -AllowUnsigned
          }
        env:
          WINTUNE_SIGN_ENABLED: ${{ vars.WINTUNE_SIGN_ENABLED }}

      - name: Install Inno Setup (optional installer)
        shell: pwsh
        run: .\scripts\install-innosetup.ps1

      - name: Build ARM64 Setup.exe (optional)
        shell: pwsh
        env:
          WINTUNE_SIGN_ENABLED: ${{ vars.WINTUNE_SIGN_ENABLED }}
          WINTUNE_SIGN_PFX_BASE64: ${{ secrets.WINTUNE_SIGN_PFX_BASE64 }}
          WINTUNE_SIGN_PASSWORD: ${{ secrets.WINTUNE_SIGN_PASSWORD }}
          WINTUNE_SIGN_TIMESTAMP: ${{ vars.WINTUNE_SIGN_TIMESTAMP }}
        run: |
          .\scripts\installer.ps1 -Version ${{ needs.resolve-version.outputs.value }} `
            -Arch arm64 -Channel ${{ needs.resolve-version.outputs.channel }} `
            -SignIfConfigured -SkipIfMissingInno

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wintune-arm64
          path: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip.sha256
          if-no-files-found: error

      - name: Upload ARM64 installer (optional)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wintune-arm64-setup
          path: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64-setup.exe
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64-setup.exe.sha256
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    # Do not wait on package-arm64. That job uses a private runner; if it
    # never starts, the x64 zip is never uploaded and WinGet reports 404.
    needs: [resolve-version, package-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download x64 artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wintune-x64
          path: dist

      - name: Download x64 installer (optional)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wintune-x64-setup
          path: dist

      - name: Upload x64 release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.resolve-version.outputs.value) || github.ref_name }}
          name: WinTune ${{ needs.resolve-version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip.sha256
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64-setup.exe
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64-setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-arm64:
    name: Attach ARM64 release assets
    needs: [resolve-version, package-arm64, release]
    if: ${{ needs.package-arm64.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download ARM64 artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wintune-arm64
          path: dist

      - name: Download ARM64 installer (optional)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wintune-arm64-setup
          path: dist

      - name: Upload ARM64 release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.resolve-version.outputs.value) || github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip.sha256
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64-setup.exe
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64-setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
