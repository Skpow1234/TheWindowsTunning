name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}"
          }
          $v = $v.Trim()
          if ($v.StartsWith("v") -or $v.StartsWith("V")) { $v = $v.Substring(1) }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[\w\.]+)?$') {
            Write-Error "Invalid version '$v'. Use semver like 0.1.0 or tag v0.1.0."
            exit 1
          }
          $channel = "stable"
          if ($v -match "-beta") { $channel = "beta" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Package release (x64 + ARM64)
        shell: pwsh
        run: |
          .\scripts\release.ps1 -Version ${{ steps.version.outputs.value }} `
            -Config Release -Arch all -Channel ${{ steps.version.outputs.channel }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.value) || github.ref_name }}
          name: WinTune ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/WinTune-${{ steps.version.outputs.value }}-win-x64.zip
            dist/WinTune-${{ steps.version.outputs.value }}-win-x64.zip.sha256
            dist/WinTune-${{ steps.version.outputs.value }}-win-arm64.zip
            dist/WinTune-${{ steps.version.outputs.value }}-win-arm64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
