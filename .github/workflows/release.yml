name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          v="${v#v}"
          v="${v#V}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Invalid version: $v" >&2
            exit 1
          fi
          channel="stable"
          case "$v" in *-beta*) channel="beta" ;; esac
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  package-x64:
    name: Package (x64)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package x64
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Config Release -Arch x64 -Version ${{ needs.resolve-version.outputs.value }} `
            -Channel ${{ needs.resolve-version.outputs.channel }} -Configure -Build -Zip

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintune-x64
          path: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip.sha256

  package-arm64:
    name: Package (ARM64)
    needs: resolve-version
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package ARM64
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Config Release -Arch arm64 -Version ${{ needs.resolve-version.outputs.value }} `
            -Channel ${{ needs.resolve-version.outputs.channel }} -Configure -Build -Zip

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintune-arm64
          path: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip.sha256

  release:
    name: Publish GitHub Release
    needs: [resolve-version, package-x64, package-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.resolve-version.outputs.value) || github.ref_name }}
          name: WinTune ${{ needs.resolve-version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-x64.zip.sha256
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip
            dist/WinTune-${{ needs.resolve-version.outputs.value }}-win-arm64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
