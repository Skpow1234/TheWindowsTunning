# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# Draft installer manifest. Before submitting to winget-pkgs:
# 1. Publish a GitHub Release with WinTune-<ver>-win-x64.zip.
#    Confirm the URL returns 200. Omit arm64 unless that zip was uploaded.
# 2. Replace the InstallerSha256 values using the .sha256 sidecars from the release.
#    The zip must contain a statically linked wintune.exe (no VCRUNTIME140.dll).
# 3. Bump PackageVersion to match the tag (without leading "v").
#
PackageIdentifier: WinTune.WinTune
PackageVersion: 0.3.0
InstallerLocale: en-US
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: wintune.exe
    PortableCommandAlias: wintune
UpgradeBehavior: uninstallPrevious
Commands:
  - wintune
ReleaseDate: 2026-10-09
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Skpow1234/TheWindowsTunning/releases/download/v0.3.0/WinTune-0.3.0-win-x64.zip
    InstallerSha256: 321ba650cbfaafd4b051c8b0a761dc2fd1916aa192ae7e4a66dc2567a3e42dbd
  - Architecture: arm64
    InstallerUrl: https://github.com/Skpow1234/TheWindowsTunning/releases/download/v0.3.0/WinTune-0.3.0-win-arm64.zip
    InstallerSha256: e335de53f8b32968502d6b4603a854010878faff608f6771297f36e554c31226
ManifestType: installer
ManifestVersion: 1.6.0
