# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# Draft installer manifest. Before submitting to winget-pkgs:
# 1. Publish a GitHub Release with WinTune-<ver>-win-x64.zip (+ arm64).
# 2. Replace REPLACE_WITH_SHA256_* using the .sha256 sidecars from the release.
# 3. Bump PackageVersion to match the tag (without leading "v").
#
PackageIdentifier: WinTune.WinTune
PackageVersion: 0.1.2
InstallerLocale: en-US
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: wintune.exe
    PortableCommandAlias: wintune
UpgradeBehavior: uninstallPrevious
Commands:
  - wintune
ReleaseDate: 2026-07-01
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Skpow1234/TheWindowsTunning/releases/download/v0.1.2/WinTune-0.1.2-win-x64.zip
    InstallerSha256: REPLACE_WITH_SHA256_X64
  - Architecture: arm64
    InstallerUrl: https://github.com/Skpow1234/TheWindowsTunning/releases/download/v0.1.2/WinTune-0.1.2-win-arm64.zip
    InstallerSha256: REPLACE_WITH_SHA256_ARM64
ManifestType: installer
ManifestVersion: 1.6.0
